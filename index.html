          if (_agRec.stream)    { _agRec.stream.getTracks().forEach(function(t){ t.stop(); }); _agRec.stream = null; }
          var bufs = _agRec.pcmBufs; _agRec.pcmBufs = [];
          var total = 0; bufs.forEach(function(b){ total += b.length; });
          _agLastRecordInfo = 'SP/' + total + 'smp';
          if (total < 8820) { resolve(''); return; }
          var pcm = new Float32Array(total); var off = 0;
          bufs.forEach(function(b){ pcm.set(b, off); off += b.length; });
          var wav = _agPCMtoWAV(pcm, _agRec.sr);
          var r = new FileReader(); r.onloadend = function(){ resolve(r.result || ''); }; r.readAsDataURL(wav);
        }
      });
    }

    function atGitsinCancelIOSRecording() {
      _agRec.active = false;
      if (_agRec.mediaRecorder && _agRec.mediaRecorder.state !== 'inactive') {
        try { _agRec.mediaRecorder.stop(); } catch(e) {}
      }
      _agRec.mediaRecorder = null; _agRec.chunks = []; _agRec.useMediaRecorder = false;
      if (_agRec.processor) { try { _agRec.processor.disconnect(); } catch(e) {} _agRec.processor = null; }
      if (_agRec.audioCtx)  { try { _agRec.audioCtx.close(); }       catch(e) {} _agRec.audioCtx = null; }
      if (_agRec.stream)    { _agRec.stream.getTracks().forEach(function(t){ t.stop(); }); _agRec.stream = null; }
      _agRec.pcmBufs = [];
    }

    // ── Eski overlay kodu (artık kullanılmıyor) ───────────────────────────────
    var _agIOSResolve = null;
    var _agIOSActive = false;
    var _agIOSTimer = null;
    var _agIOSSecs = 0;
    var _agIOSStream = null;
    var _agIOSAudioCtx = null;
    var _agIOSProcessor = null;
    var _agIOSPCMBufs = [];
    var _agIOSSR = 44100;

    function atGitsinShowIOSOverlay() {
      return new Promise(function(resolve) {
        _agIOSResolve = resolve;
        _agIOSActive = false;
        _agIOSPCMBufs = [];
        document.getElementById('ag-ios-status').textContent = 'Mikrofona bas ve konuş';
        document.getElementById('ag-ios-mic').textContent = '🎤';
        document.getElementById('ag-ios-mic').style.background = '#E67E22';
        document.getElementById('ag-ios-mic').disabled = false;
        document.getElementById('ag-ios-rec').style.display = 'flex';
      });
    }

    function atGitsinIOSTap() {
      if (_agIOSActive) {
        // ── DURDUR ────────────────────────────────────────────────────────
        _agIOSActive = false;
        if (_agIOSTimer) { clearInterval(_agIOSTimer); _agIOSTimer = null; }
        document.getElementById('ag-ios-status').textContent = 'İşleniyor...';
        document.getElementById('ag-ios-mic').textContent = '⏳';
        document.getElementById('ag-ios-mic').disabled = true;

        if (_agIOSProcessor) { try { _agIOSProcessor.disconnect(); } catch(e) {} _agIOSProcessor = null; }
        if (_agIOSAudioCtx) { try { _agIOSAudioCtx.close(); } catch(e) {} _agIOSAudioCtx = null; }
        if (_agIOSStream) { _agIOSStream.getTracks().forEach(function(t) { t.stop(); }); _agIOSStream = null; }

        var bufs = _agIOSPCMBufs; _agIOSPCMBufs = [];
        var totalLen = 0;
        bufs.forEach(function(b) { totalLen += b.length; });
        document.getElementById('ag-ios-rec').style.display = 'none';

        if (totalLen < 3200) {
          if (_agIOSResolve) { _agIOSResolve(''); _agIOSResolve = null; }
          return;
        }
        var pcm = new Float32Array(totalLen);
        var off = 0;
        bufs.forEach(function(b) { pcm.set(b, off); off += b.length; });
        var wavBlob = _agPCMtoWAV(pcm, _agIOSSR);
        var reader = new FileReader();
        reader.onloadend = function() {
          if (_agIOSResolve) { _agIOSResolve(reader.result || ''); _agIOSResolve = null; }
        };
        reader.readAsDataURL(wavBlob);
        return;
      }

      // ── BAŞLAT — bu onclick iOS Safari'de trusted gesture ─────────────
      // AudioContext iOS'ta MUTLAKA user gesture içinde (senkron) yaratılmalı.
      // getUserMedia().then() asenkron olduğu için burada yaratıyoruz.
      try {
        _agIOSAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        _agIOSSR = _agIOSAudioCtx.sampleRate;
        if (_agIOSAudioCtx.state === 'suspended') _agIOSAudioCtx.resume();
      } catch(e) { _agIOSAudioCtx = null; }

      // İzin istenirken butonu devre dışı bırak (çift tık koruması)
      document.getElementById('ag-ios-mic').disabled = true;
      document.getElementById('ag-ios-status').textContent = 'Mikrofon izni isteniyor...';
      // Basit audio kısıtlaması — iOS uyumluluğu için minimal
      navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(function(stream) {
          _agIOSStream = stream;
          _agIOSPCMBufs = [];
          if (!_agIOSAudioCtx) {
            _agIOSAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            _agIOSSR = _agIOSAudioCtx.sampleRate;
          }
          var source = _agIOSAudioCtx.createMediaStreamSource(stream);
          _agIOSProcessor = _agIOSAudioCtx.createScriptProcessor(4096, 1, 1);
          _agIOSProcessor.onaudioprocess = function(e) {
            if (_agIOSActive) {
              _agIOSPCMBufs.push(new Float32Array(e.inputBuffer.getChannelData(0)));
            }
          };
          // Hoparlörden ses çıkmaması için sıfır kazanç filtresiyle destination'a bağla
          var silentSink = _agIOSAudioCtx.createGain();
          silentSink.gain.value = 0;
          source.connect(_agIOSProcessor);
          _agIOSProcessor.connect(silentSink);
          silentSink.connect(_agIOSAudioCtx.destination);

          _agIOSActive = true;
          document.getElementById('ag-ios-mic').textContent = '⏹';
          document.getElementById('ag-ios-mic').style.background = '#C0392B';
          document.getElementById('ag-ios-mic').disabled = false;
          _agIOSSecs = 20;
          document.getElementById('ag-ios-status').textContent = 'Konuş… ' + _agIOSSecs + 's — durdurmak için tekrar bas';
          _agIOSTimer = setInterval(function() {
            _agIOSSecs--;
            if (_agIOSSecs <= 0) {
              clearInterval(_agIOSTimer); _agIOSTimer = null;
              if (_agIOSActive) atGitsinIOSTap();
            } else {
              document.getElementById('ag-ios-status').textContent = 'Konuş… ' + _agIOSSecs + 's — durdurmak için tekrar bas';
            }
          }, 1000);
        })
        .catch(function(err) {
          _agLastError = err && err.name ? (err.name + ': ' + err.message) : String(err);
          var micBtn = document.getElementById('ag-ios-mic');
          micBtn.textContent = '🔄';
          micBtn.style.background = '#636e72';
          micBtn.disabled = false;
          _agIOSActive = false;
          document.getElementById('ag-ios-status').innerHTML =
            '<span style="font-size:15px">📱 iPhone Ayarlar → <b>Safari</b><br>→ <b>Mikrofon</b> → İzin Ver</span><br>' +
            '<span style="font-size:13px;opacity:0.7">Sonra 🔄 butonuna bas</span>';
        });
    }

    function atGitsinIOSCancel() {
      _agIOSActive = false;
      if (_agIOSTimer) { clearInterval(_agIOSTimer); _agIOSTimer = null; }
      if (_agIOSProcessor) { try { _agIOSProcessor.disconnect(); } catch(e) {} _agIOSProcessor = null; }
      if (_agIOSAudioCtx) { try { _agIOSAudioCtx.close(); } catch(e) {} _agIOSAudioCtx = null; }
      if (_agIOSStream) { _agIOSStream.getTracks().forEach(function(t) { t.stop(); }); _agIOSStream = null; }
      _agIOSPCMBufs = [];
      document.getElementById('ag-ios-rec').style.display = 'none';
      if (_agIOSResolve) { _agIOSResolve(''); _agIOSResolve = null; }
    }

    function _agPCMtoWAV(pcm, sr) {
      var n = pcm.length;
      var buf = new ArrayBuffer(44 + n * 2);
      var dv = new DataView(buf);
      var ws = function(o, s) { for(var i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
      ws(0,'RIFF'); dv.setUint32(4,36+n*2,true); ws(8,'WAVE');
      ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
      dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
      ws(36,'data'); dv.setUint32(40,n*2,true);
      for(var i=0;i<n;i++){var v=Math.max(-1,Math.min(1,pcm[i]));dv.setInt16(44+i*2,v<0?v*0x8000:v*0x7FFF,true);}
      return new Blob([dv],{type:'audio/wav'});
    }
  </script>
