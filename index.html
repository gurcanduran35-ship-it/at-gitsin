  <script>
    window.addEventListener('flutter-first-frame', function() {

    });
    var _audioCtx = null;
    function playNotificationBeep() {
      try {
        if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var ctx = _audioCtx;
        var resume = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
        resume.then(function() {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.35, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
          osc.start();
          osc.stop(ctx.currentTime + 0.8);
        });
      } catch(e) {}
    }

    // ── At Gitsin Mikrofon (MediaRecorder) ───────────────────────────────────
    var _agRecorder = null;
    var _agChunks = [];

    // ── Web Speech API (Chrome/Edge/Android) ────────────────────────────────
    var _agSpeechRecognition = null;

    function atGitsinHasSpeechApi() {
      return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    function atGitsinStartSpeech() {
      return new Promise(function(resolve) {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { resolve(null); return; }
        _agSpeechRecognition = new SR();
        _agSpeechRecognition.lang = 'tr-TR';
        _agSpeechRecognition.continuous = false;
        _agSpeechRecognition.interimResults = false;
        _agSpeechRecognition.maxAlternatives = 3;
        var resolved = false;
        function done(text) {
          if (!resolved) {
            resolved = true;
            _agSpeechRecognition = null;
            resolve(text && text.trim().length > 0 ? text.trim() : null);
          }
        }
        _agSpeechRecognition.onresult = function(e) {
          var parts = [];
          for (var i = 0; i < e.results.length; i++) parts.push(e.results[i][0].transcript);
          done(parts.join(' '));
        };
        _agSpeechRecognition.onerror = function(e) { console.warn('SR error:', e.error); done(null); };
        _agSpeechRecognition.onend = function() { done(null); };
        try { _agSpeechRecognition.start(); }
        catch(e) { console.warn('SR start error:', e); done(null); }
      });
    }

    function atGitsinStopSpeech() {
      if (_agSpeechRecognition) {
        try { _agSpeechRecognition.stop(); } catch(e) {}
        _agSpeechRecognition = null;
      }
    }

    // ── PWA Kurulum ──────────────────────────────────────────────────────────
    var _pwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      _pwaPrompt = e;
    });
    function atGitsinCanInstall() { return _pwaPrompt !== null; }
    function atGitsinShowInstall() {
      if (!_pwaPrompt) return;
      _pwaPrompt.prompt();
      _pwaPrompt.userChoice.then(function() { _pwaPrompt = null; });
    }
    function atGitsinIsIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    function atGitsinIsStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    // ── GPS Konum ────────────────────────────────────────────────────────────
    function atGitsinGetPosition() {
      return new Promise(function(resolve) {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          function(pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
          function() { resolve(null); },
          { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
        );
      });
    }

    // ── MediaRecorder + Whisper (iOS Safari fallback) ────────────────────────
    function atGitsinStartRecording() {
      return navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(function(stream) {
          _agChunks = [];
          var candidates = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
          var mimeType = '';
          for (var i = 0; i < candidates.length; i++) {
            if (typeof MediaRecorder !== 'undefined' && typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported(candidates[i])) {
              mimeType = candidates[i]; break;
            }
          }
          try {
            _agRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
          } catch(e) { _agRecorder = new MediaRecorder(stream); }
          _agRecorder.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) _agChunks.push(e.data);
          };
          _agRecorder.start(1000);
          return true;
        })
        .catch(function(err) { console.warn('atGitsin mic error:', err); return false; });
    }

    function atGitsinStopRecording() {
      return new Promise(function(resolve) {
        if (!_agRecorder || _agRecorder.state === 'inactive') { resolve(''); return; }
        _agRecorder.onstop = function() {
          var mime = _agRecorder.mimeType || 'audio/mp4';
          var blob = new Blob(_agChunks, { type: mime });
          if (blob.size === 0) {
            _agRecorder.stream.getTracks().forEach(function(t) { t.stop(); });
            _agRecorder = null;
            resolve(''); return;
          }
          var reader = new FileReader();
          reader.onloadend = function() {
            _agRecorder.stream.getTracks().forEach(function(t) { t.stop(); });
            _agRecorder = null;
            resolve(reader.result || '');
          };
          reader.readAsDataURL(blob);
        };
        try { if (_agRecorder.state === 'recording') _agRecorder.requestData(); } catch(e) {}
        setTimeout(function() {
          try { _agRecorder.stop(); } catch(e) { resolve(''); }
        }, 100);
      });
    }
