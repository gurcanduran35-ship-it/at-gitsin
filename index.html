  <script>
    window.addEventListener('flutter-first-frame', function() {

    var _audioCtx = null;
    function playNotificationBeep() {
      try {
        if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var ctx = _audioCtx;
        var resume = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
        resume.then(function() {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.35, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
          osc.start();
          osc.stop(ctx.currentTime + 0.8);
        });
      } catch(e) {}
    }

    // ── At Gitsin Mikrofon ────────────────────────────────────────────────────
    var _agLastError = '';

    function atGitsinGetLastError() { return _agLastError; }

    // ── Web Speech API (Chrome/Edge/Android) ────────────────────────────────
    var _agSpeechRecognition = null;

    function atGitsinHasSpeechApi() {
      // iOS has webkitSpeechRecognition since iOS 16 but it's unreliable in PWA mode
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) return false;
      return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    function atGitsinStartSpeech() {
      return new Promise(function(resolve) {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { resolve(null); return; }
        _agSpeechRecognition = new SR();
        _agSpeechRecognition.lang = 'tr-TR';
        _agSpeechRecognition.continuous = false;
        _agSpeechRecognition.interimResults = false;
        _agSpeechRecognition.maxAlternatives = 3;
        var resolved = false;
        function done(text) {
          if (!resolved) {
            resolved = true;
            _agSpeechRecognition = null;
            resolve(text && text.trim().length > 0 ? text.trim() : null);
          }
        }
        _agSpeechRecognition.onresult = function(e) {
          var parts = [];
          for (var i = 0; i < e.results.length; i++) parts.push(e.results[i][0].transcript);
          done(parts.join(' '));
        };
        _agSpeechRecognition.onerror = function(e) { console.warn('SR error:', e.error); done(null); };
        _agSpeechRecognition.onend = function() { done(null); };
        try { _agSpeechRecognition.start(); }
        catch(e) { console.warn('SR start error:', e); done(null); }
      });
    }

    function atGitsinStopSpeech() {
      if (_agSpeechRecognition) {
        try { _agSpeechRecognition.stop(); } catch(e) {}
        _agSpeechRecognition = null;
      }
    }

    // ── PWA Kurulum ──────────────────────────────────────────────────────────
    var _pwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      _pwaPrompt = e;
    });
    function atGitsinCanInstall() { return _pwaPrompt !== null; }
    function atGitsinShowInstall() {
      if (!_pwaPrompt) return;
      _pwaPrompt.prompt();
      _pwaPrompt.userChoice.then(function() { _pwaPrompt = null; });
    }
    function atGitsinIsIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    function atGitsinIsStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    // ── GPS Konum ────────────────────────────────────────────────────────────
    function atGitsinGetPosition() {
      return new Promise(function(resolve) {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          function(pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
          function() { resolve(null); },
          { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
        );
      });
    }

    // ── iOS Native Recording Overlay ─────────────────────────────────────────
    var _agIOSResolve = null;
    var _agIOSRec = null;
    var _agIOSChunks = [];
    var _agIOSActive = false;
    var _agIOSTimer = null;
    var _agIOSSecs = 0;

    function atGitsinShowIOSOverlay() {
      return new Promise(function(resolve) {
        _agIOSResolve = resolve;
        _agIOSActive = false;
        _agIOSChunks = [];
        _agIOSRec = null;
        document.getElementById('ag-ios-status').textContent = 'Mikrofona bas ve konuş';
        document.getElementById('ag-ios-mic').textContent = '🎤';
        document.getElementById('ag-ios-mic').style.background = '#E67E22';
        document.getElementById('ag-ios-mic').disabled = false;
        document.getElementById('ag-ios-rec').style.display = 'flex';
      });
    }

    function atGitsinIOSTap() {
      if (_agIOSActive) {
        _agIOSActive = false;
        if (_agIOSTimer) { clearInterval(_agIOSTimer); _agIOSTimer = null; }
        document.getElementById('ag-ios-status').textContent = 'İşleniyor...';
        document.getElementById('ag-ios-mic').textContent = '⏳';
        document.getElementById('ag-ios-mic').disabled = true;
        if (_agIOSRec && _agIOSRec.state !== 'inactive') {
          try { _agIOSRec.requestData(); } catch(e) {}
          setTimeout(function() { try { _agIOSRec.stop(); } catch(e) {} }, 150);
        }
        return;
      }
      // Start — this onclick is a trusted gesture on iOS Safari
      document.getElementById('ag-ios-status').textContent = 'Mikrofon izni isteniyor...';
      navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(function(stream) {
          _agIOSChunks = [];
          var candidates = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
          var mimeType = '';
          for (var i = 0; i < candidates.length; i++) {
            if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
              mimeType = candidates[i]; break;
            }
          }
          try {
            _agIOSRec = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
          } catch(e) { _agIOSRec = new MediaRecorder(stream); }
          _agIOSRec.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) _agIOSChunks.push(e.data);
          };
          _agIOSRec.onstop = function() {
            var rec = _agIOSRec;
            stream.getTracks().forEach(function(t) { t.stop(); });
            setTimeout(function() {
              var mime = rec && rec.mimeType ? rec.mimeType : 'audio/mp4';
              var blob = new Blob(_agIOSChunks, { type: mime });
              _agIOSRec = null;
              document.getElementById('ag-ios-rec').style.display = 'none';
              if (blob.size < 1000) {
                if (_agIOSResolve) { _agIOSResolve(''); _agIOSResolve = null; }
                return;
              }
              var reader = new FileReader();
              reader.onloadend = function() {
                if (_agIOSResolve) { _agIOSResolve(reader.result || ''); _agIOSResolve = null; }
              };
              reader.readAsDataURL(blob);
            }, 500);
          };
          _agIOSRec.start(100);
          _agIOSActive = true;
          document.getElementById('ag-ios-mic').textContent = '⏹';
          document.getElementById('ag-ios-mic').style.background = '#C0392B';
          _agIOSSecs = 20;
          document.getElementById('ag-ios-status').textContent = 'Konuş… ' + _agIOSSecs + 's — durdurmak için tekrar bas';
          _agIOSTimer = setInterval(function() {
            _agIOSSecs--;
            if (_agIOSSecs <= 0) {
              clearInterval(_agIOSTimer); _agIOSTimer = null;
              if (_agIOSActive) atGitsinIOSTap();
            } else {
              document.getElementById('ag-ios-status').textContent = 'Konuş… ' + _agIOSSecs + 's — durdurmak için tekrar bas';
            }
          }, 1000);
        })
        .catch(function(err) {
          _agLastError = err && err.name ? (err.name + ': ' + err.message) : String(err);
          var micBtn = document.getElementById('ag-ios-mic');
          micBtn.textContent = '🔄';
          micBtn.style.background = '#636e72';
          micBtn.disabled = false;
          _agIOSActive = false;
          document.getElementById('ag-ios-status').innerHTML =
            '<span style="font-size:15px">📱 iPhone Ayarlar → <b>Safari</b><br>→ <b>Mikrofon</b> → İzin Ver</span><br>' +
            '<span style="font-size:13px;opacity:0.7">Sonra 🔄 butonuna bas</span>';
        });
    }

    function atGitsinIOSCancel() {
      _agIOSActive = false;
      if (_agIOSTimer) { clearInterval(_agIOSTimer); _agIOSTimer = null; }
      if (_agIOSRec && _agIOSRec.state !== 'inactive') {
        _agIOSChunks = [];
        try {
          if (_agIOSRec.stream) _agIOSRec.stream.getTracks().forEach(function(t) { t.stop(); });
          _agIOSRec.stop();
        } catch(e) {}
      }
      _agIOSRec = null;
      document.getElementById('ag-ios-rec').style.display = 'none';
      if (_agIOSResolve) { _agIOSResolve(''); _agIOSResolve = null; }
    }
  </script>
