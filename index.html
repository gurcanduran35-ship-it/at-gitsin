        #0E1A27;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    /* Arka plan: silik harita rotaları */
    #splash .routes { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
    #splash .routes path { stroke-dasharray: 4 7; animation: ag-route 14s linear infinite; }
    @keyframes ag-route { to { stroke-dashoffset: -220; } }
    /* Kenar karartma (premium derinlik) */
    #splash::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(90% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%);
    }

    /* Gümüş çerçeveli logo kartı */
    .ag-badge {
      position: relative; z-index: 1;
      width: 132px; height: 132px; border-radius: 34px; padding: 5px;
      background: linear-gradient(145deg, #F4F6F8 0%, #AEB6BF 38%, #E9ECEF 55%, #8C96A1 100%);
      box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08), 0 0 60px rgba(120,170,220,.18);
      animation: ag-rise .8s cubic-bezier(.2,.8,.2,1) both;
      overflow: hidden;
    }
    .ag-badge img {
      width: 100%; height: 100%; display: block; border-radius: 29px; background: #fff; object-fit: cover;
    }
    /* Gümüş çerçeve üzerinden geçen ışık */
    .ag-badge::after {
      content: ''; position: absolute; top: -40%; left: -60%; width: 40%; height: 180%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
      transform: rotate(18deg);
      animation: ag-shine 3.2s ease-in-out 1s infinite;
    }
    @keyframes ag-shine { 0% { left: -60%; } 45%, 100% { left: 140%; } }
    @keyframes ag-rise { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }

    .ag-title {
      position: relative; z-index: 1; margin: 22px 0 4px;
      font-size: 26px; font-weight: 800; letter-spacing: 5px;
      background: linear-gradient(180deg, #FFFFFF 0%, #C9D1D9 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 2px 12px rgba(0,0,0,.35);
      animation: ag-rise .8s .12s cubic-bezier(.2,.8,.2,1) both;
    }
    .ag-sub {
      position: relative; z-index: 1; margin: 0;
      font-size: 13px; letter-spacing: .4px; color: rgba(214,224,234,.62);
      animation: ag-rise .8s .22s cubic-bezier(.2,.8,.2,1) both;
    }

    /* Yükleniyor: yolda ilerleyen at taşıma aracı */
    .ag-road {
      position: relative; z-index: 1; width: 260px; height: 52px; margin-top: 40px;
      animation: ag-rise .8s .32s cubic-bezier(.2,.8,.2,1) both;
    }
    .ag-road .lane {
      position: absolute; left: 0; right: 0; bottom: 4px; height: 2px;
      background: repeating-linear-gradient(90deg, rgba(200,210,220,.45) 0 12px, transparent 12px 22px);
      background-size: 22px 2px;
      animation: ag-lane .6s linear infinite;
      -webkit-mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
              mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
    }
    @keyframes ag-lane { to { background-position: -22px 0; } }
    .ag-road svg {
      position: absolute; bottom: 5px; left: 0; width: 104px; height: 42px;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.45));
      animation: ag-drive 2.6s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    @keyframes ag-drive {
      0%   { transform: translateX(-10px); opacity: 0; }
      12%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateX(170px); opacity: 0; }
    }
    .ag-road .wheel { animation: ag-bounce .3s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes ag-bounce { to { transform: translateY(-.6px); } }

    .ag-loading {
      position: relative; z-index: 1; margin-top: 12px;
      font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(214,224,234,.55);
    }
    .ag-loading i { font-style: normal; animation: ag-dot 1.2s infinite; opacity: 0; }
    .ag-loading i:nth-child(2) { animation-delay: .2s; }
    .ag-loading i:nth-child(3) { animation-delay: .4s; }
    @keyframes ag-dot { 30%, 70% { opacity: 1; } }

    /* "Animasyon efektleri" kapalı cihazlar (ör. Windows ayarı): sadece süs hareketleri
       durur; yükleniyor animasyonu (araç + noktalar) "çalışıyor" bilgisi verdiği için oynar. */
    @media (prefers-reduced-motion: reduce) {
      #splash .routes path, .ag-badge::after { animation: none !important; }
    }
  </style>
</head>

  <script>
    // ── iOS Overlay Touch Capture — Flutter'dan ÖNCE çalışır ─────────────────

    (function() {

        if (!_agOverlayVisible()) return;

        if (!_agOverlayVisible()) return;

    var _agTtsToken = 0;
    function _agPickTrVoice() {
      try {
        var vs = (window.speechSynthesis.getVoices() || []).filter(function (v) {

        });
        if (!vs.length) return null;
        // Doğal/online sesler daha az robotik: önce onları seç
        var pref = ['natural', 'online', 'neural', 'google', 'yelda', 'emel', 'ahmet'];
        for (var i = 0; i < pref.length; i++) {

    function atGitsinSpeak(text, onDone) {

    function _agPCMtoWAV(pcm, sr) {

      var dv = new DataView(buf);
      var ws = function(o, s) { for(var i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };

      ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
      dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
      ws(36,'data'); dv.setUint32(40,n*2,true);
      for(var i=0;i<n;i++){var v=Math.max(-1,Math.min(1,pcm[i]));dv.setInt16(44+i*2,v<0?v*0x8000:v*0x7FFF,true);}

    // Yeni sürüm yayınlandığında (UpdateChecker) sayfayı yenile
    function atGitsinReload() { location.reload(); }

    // ── Uygulama kapalıyken bildirim (Web Push) ──────────────────────────────

      for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);

    async function _agPushSubscribe(vapidKey) {

          userVisibleOnly: true,
          applicationServerKey: _agB64ToBytes(vapidKey),

    // Kullanıcı butona bastığında çağrılır (izin penceresi gesture içinde açılmalı).

      }
    }

    // Açılışta: izin zaten verilmişse aboneliği sessizce tazele (izin penceresi açmaz).
    async function atGitsinRefreshPush(vapidKey) {

      } catch (e) { return ''; }
    }
